<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#001e2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="테디">
<title>테디</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<style>
/* ── 색·크기는 여기만 고치면 된다 ── */
:root {
  --chat: calc(clamp(340px, 26vw, 470px) + var(--chatAdj, 0px));   /* 오른쪽 채팅창 너비. 왼쪽 가장자리를 끌면 ±60px */
  --navy: #001e2b;                     /* 맨 위 막대 */
  --green: #00b45a;                    /* 가장자리·강조 */
  --green-soft: #9fe3bd;               /* 옅은 가장자리 */
  --green-deep: #0a6b3a;               /* 진한 초록 글자 */
  --title: #1d4ed8;                    /* 카드 제목 (로열 블루) */
  --tint: #eef1f4;                     /* 페이지 바탕 */
  --card: #fff;                        /* 내용 바탕 */
  --text: #16232b;
  --muted: #5c6b73;
  --hair: #e3ece7;
  --up: #d63a2f;                       /* 상승(한국식 빨강) */
  --down: #1f62d6;                     /* 하락(한국식 파랑) */
  --glass: rgba(255, 255, 255, .55);   /* 유리 바탕 */
  --glass-edge: rgba(255, 255, 255, .75);
  --glass-shade: 0 6px 22px rgba(0, 50, 45, .12);
  --wash: none;
  --font: 1;                           /* 전체 글자 배율 */
  --fs: var(--font);
}
@media (prefers-color-scheme: dark) {
  :root {
    --green: #16c76c;
    --green-soft: #1f6b47;
    --green-deep: #4fdc94;
    --title: #7cb8ff;
    --tint: #12171c;
    --card: #101d23;
    --text: #e9f1ee;
    --muted: #93a5ad;
    --hair: #223239;
    --up: #ff7b72;
    --down: #6ea4ff;
    --glass: rgba(20, 36, 44, .52);
    --glass-edge: rgba(255, 255, 255, .13);
    --glass-shade: 0 6px 22px rgba(0, 0, 0, .35);
    --wash: none;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; overflow: hidden; color: var(--text); background: var(--wash), var(--tint);
  font: calc(14px * var(--fs))/1.35 "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  word-break: keep-all; overflow-wrap: anywhere;
}
button, textarea, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: calc(12px * var(--fs)); }

/* 왼쪽 판 */
#board { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#top { height: 28px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: rgba(0, 30, 43, .78); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: #d7e5e0; font-size: calc(13px * var(--fs)); }
#top svg { width: 20px; height: 20px; }
#tabs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: auto hidden; scrollbar-width: none; }
.btab { flex: none; display: flex; align-items: center; border-radius: 7px; }
.btab.over { outline: 2px solid var(--green); }
.tname { height: 22px; padding: 0 9px; border-radius: 7px; color: #d7e5e0; white-space: nowrap; touch-action: none; }
.tname:hover { background: rgba(255, 255, 255, .14); color: #fff; }
.tname[aria-selected="true"] { background: var(--green); color: #fff; font-weight: 700; }
.tx { display: none; width: 16px; height: 22px; padding: 0; color: #8fa8a0; }
.tx:hover { color: #fff; }
.tname[aria-selected="true"] + .tx { display: block; }
.btab:only-of-type .tx { display: none; }
.btab input { width: 90px; height: 20px; padding: 0 6px; border: 0; border-radius: 6px; color: var(--text); background: var(--card); }
#tabPlus { flex: none; }
#top .right { margin-left: auto; color: #8fa8a0; font-size: calc(12px * var(--fs)); }
#cols { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--cols, repeat(3, minmax(0, 1fr))); gap: 5px; padding: 0 10px; }
.col { display: flex; flex-direction: column; gap: 5px; min-height: 0; min-width: 0; padding: 10px 0; }
.col::after { content: ""; flex: var(--rest, 0) 1 0; margin-top: -5px; }
.card {
  background: radial-gradient(150px 90px at 0 0, color-mix(in srgb, var(--green) 30%, var(--card)), var(--card)); border: 1px solid var(--glass-edge); border-radius: 14px; box-shadow: var(--glass-shade);
  -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%);
  padding: 8px 12px 8px; display: flex; flex-direction: column; min-height: 0;
  position: relative; overflow: hidden auto; --fs: calc(var(--font) * var(--own, 1)); font-size: calc(14px * var(--fs));
}
.card, .card :not(textarea) { scrollbar-width: none; }  /* 스크롤막대 대신 가장자리 화살표(widgets.js) */
.card::-webkit-scrollbar, .card :not(textarea)::-webkit-scrollbar { display: none; }
#scrollArrow { position: fixed; z-index: 50; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 1.5px solid var(--green); border-radius: 50%; background: var(--card); color: var(--green-deep); font-size: 11px; line-height: 1; box-shadow: var(--glass-shade); }
#scrollArrow[hidden] { display: none; }
.card.picked { outline: 2px solid var(--green); outline-offset: -2px; }  /* 테두리 대신 써서 크기가 변하지 않는다 */
/* 카드 맨 위 가운데 손잡이: 끌어서 이동, 속성 */
.grip { flex: none; display: flex; gap: 2px; opacity: 0; }
#marketCard > .grip { position: absolute; top: 7px; right: 10px; }
#syms { padding-right: 44px; }
.card:hover .grip, .grip:focus-within { opacity: 1; }
.grip button { height: 16px; padding: 0 4px; border-radius: 5px; background: var(--tint); color: var(--muted); font-size: 11px; line-height: 16px; }
.grip button:hover { color: var(--green); }
.grip .move { cursor: grab; touch-action: none; }
.dragging { opacity: .45; }
#dropLine { position: fixed; z-index: 8; height: 3px; border-radius: 3px; background: var(--green); display: none; pointer-events: none; }
#props { margin: 0; width: 220px; max-height: calc(100dvh - 16px); overflow: auto; padding: 12px 14px; color: var(--text); background: var(--card); border: 1.5px solid var(--green); border-radius: 14px; }
#props h3 { margin: 0 0 8px; font-size: 13px; }
#props label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
#props input { width: 100%; accent-color: var(--green); }
#propsExtra { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
#propsExtra:empty { display: none; }
#propsExtra label { align-items: center; gap: 8px; white-space: nowrap; }
#propsExtra select { margin: 0; }
#props .acts { display: flex; gap: 4px; margin-top: 8px; }
#props .acts button { flex: 1; height: 28px; border: 1px solid var(--hair); border-radius: 8px; }
#props .acts button:hover { border-color: var(--green); }
#top .icon, #fontNow { color: #d7e5e0; white-space: nowrap; }
#top .icon { flex: none; }
#top .icon:hover { background: rgba(255, 255, 255, .14); color: #fff; }
/* 넓은 화면에서만: 열 사이를 끌면 너비, 카드 사이를 끌면 높이 */
@media (min-width: 1241px) { #cols { cursor: col-resize; } .col { cursor: row-resize; } .card { cursor: auto; } }
.grow { flex: 1 1 0; }
.head { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; flex: none; }
.head h2 { white-space: nowrap; margin: 0; font-size: calc(13px * var(--fs)); font-weight: 700; }
.card .head h2 { color: var(--title); }
.head .tools { white-space: nowrap; margin-left: auto; display: flex; align-items: center; gap: 4px; }
.icon { min-width: 22px; height: 22px; padding: 0 5px; border-radius: 999px; color: var(--muted); font-size: calc(13px * var(--fs)); text-decoration: none; display: inline-grid; place-items: center; }
.icon:hover { background: var(--tint); color: var(--text); }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.list { flex: 1; overflow-y: auto; min-height: 0; }
.none { padding: 10px 2px; color: var(--muted); font-size: calc(13px * var(--fs)); }
.alert { color: var(--up); font-size: calc(12px * var(--fs)); margin-bottom: 4px; }

/* 비서 카드: 내용 높이로 고정한다 (저장된 배치의 높이는 무시) */
#agent { flex: none !important; overflow: hidden; }
#agent .who { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
#agent .bear { width: 26px; height: 26px; padding: 1px; }
.bear { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 2px solid var(--green); background: var(--card); padding: 2px; }
#agent .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#agent b { font-size: calc(15px * var(--fs)); display: block; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; }
.switch { position: relative; width: 42px; height: 24px; flex: none; margin-left: auto; }
.switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--hair); transition: .15s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: .15s; }
.switch input:checked + i { background: var(--green); }
.switch input:checked + i::after { left: 21px; }
.switch input:focus-visible + i { outline: 2px solid var(--green); outline-offset: 2px; }
.gauges, .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 3px; }
.gauge { border: 1px solid var(--hair); border-radius: 8px; padding: 1px 7px 3px; min-width: 0; }
.gauge div { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; white-space: nowrap; }
.gauge b { font-size: calc(14px * var(--fs)); display: inline; }
.bar-mini { height: 3px; border-radius: 4px; background: var(--hair); margin-top: 1px; overflow: hidden; }
.bar-mini i { display: block; height: 100%; width: 0; background: var(--green); }
.pick select { margin-top: 0; height: 24px; min-width: 0; }
.pick label { display: flex; align-items: center; gap: 4px; white-space: nowrap; font-size: calc(12px * var(--fs)); color: var(--muted); }
select, .field { width: 100%; height: 27px; border: 1px solid var(--hair); border-radius: 10px; background: var(--glass); padding: 0 8px; margin-top: 2px; }

/* 일정·뉴스·메일 줄 */
.line { display: flex; gap: 10px; padding: 4px 2px; border-bottom: 1px solid var(--hair); text-decoration: none; color: inherit; align-items: baseline; }
.line:last-child { border-bottom: 0; }
a.line:hover .t, .mail:hover .t { color: var(--green); }
.when { flex: none; width: 6.2em; font-size: calc(12px * var(--fs)); color: var(--muted); }
.when.today { color: var(--green); font-weight: 700; }
.body { min-width: 0; flex: 1; }
.t { display: block; }
.sub { display: block; font-size: calc(12px * var(--fs)); color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ask { flex: none; font-size: calc(11.5px * var(--fs)); padding: 1px 8px; border-radius: 999px; border: 1px solid var(--green); color: var(--green); opacity: 0; }
.line:hover .ask, .ask:focus-visible { opacity: 1; }
.dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--green); align-self: center; }
.dot.off { visibility: hidden; }
.ev { display: block; }
.ev summary { display: flex; gap: 10px; align-items: baseline; cursor: pointer; list-style: none; }
.ev summary::-webkit-details-marker { display: none; }
.ev summary:hover .t { color: var(--green); }
.ev[open] .t { font-weight: 700; }
.evMore { margin: 4px 0 2px; padding: 6px 10px; border-radius: 10px; background: var(--tint); font-size: calc(12px * var(--fs)); color: var(--muted); }
.evMore a { color: var(--green); }
.evGroup { display: flex; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--hair); }
.evDay { flex: none; width: 3.4em; text-align: center; font-size: calc(12px * var(--fs)); font-weight: 700; color: var(--green-deep); }
.evRows { flex: 1; min-width: 0; padding-left: 6px; border-left: 3px solid var(--green); }
.evRows .when { width: 3.2em; }
.evRows .line { border-bottom: 0; }
.ev.tight summary { padding: 0; }
.line.ev.tight { padding: 2px; }
#news .line { padding: 6px 2px; }
#news .t { display: block; white-space: normal; font-weight: 600; line-height: 1.35; }
#news .src { margin: 0; font-size: 1em; font-weight: inherit; color: inherit; white-space: normal; }
#news time { display: block; margin-top: 2px; font-size: .82em; font-weight: 400; color: var(--muted); }
#netNote { position: fixed; top: 10px; right: 16px; z-index: 30; max-width: min(420px, calc(100vw - 32px)); padding: 7px 14px; border-radius: 12px; font-size: calc(13px * var(--fs));
  color: #fff; background: #16a34a; box-shadow: var(--glass-shade); }
#netNote.bad { background: #dc2626; }
.line.mem { align-items: center; gap: 8px; padding: 3px 2px; }
.line.mem b { flex: 1; min-width: 0; }
.line.mem .amt { color: var(--muted); white-space: nowrap; }
.line.mem .kill { padding: 1px 8px; border: 0; border-radius: 8px; color: #dc2626; background: rgba(220, 38, 38, .12); font-weight: 600; cursor: pointer; }
#news .t { line-height: 1.2; }
.src { margin-left: 4px; font-size: .82em; font-weight: 400; color: var(--muted); white-space: nowrap; }
.evMore a.go { display: block; color: inherit; text-decoration: none; }
.evMore a.go:hover b { text-decoration: underline; }
.sum { display: block; white-space: pre-line; }
.evMore b { display: block; color: var(--green); font-weight: 600; }
.mail .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mail.unread .t { font-weight: 700; }
.mail.reply .t { color: var(--down); }
.mail.other .t { color: var(--mailGray); font-weight: 400; }  /* 기타는 회색, 참조는 검정 */
#mailTabs [data-kind="star"] { color: #dc2626; font-weight: 700; }
#mailTabs [data-kind="star"][aria-pressed="true"] { background: #dc2626; border-color: #dc2626; color: #fff; }
.mailStar { flex: none; width: auto; margin: 0; padding: 0; align-self: center; accent-color: #dc2626; cursor: pointer; }
.readMark { flex: none; font-size: calc(10px * var(--fs)); color: var(--muted); }
#mail, #mailTabs { --mailGray: color-mix(in srgb, var(--muted) 70%, var(--card)); }
#mailTabs [data-kind="read"][aria-pressed="false"] { color: var(--text); font-weight: 700; }
#mailTabs [data-kind="other"][aria-pressed="false"] { color: var(--mailGray); }

/* 알약 탭 */
.tabs { display: flex; gap: 3px; flex: none; flex-wrap: wrap; margin-bottom: 4px; }
.tabs button { padding: 0 9px; border-radius: 999px; border: 1px solid var(--hair); font-size: calc(12.5px * var(--fs)); white-space: nowrap; }
.tabs button:hover { border-color: var(--green); }
.tabs button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 600; }
@media (prefers-color-scheme: dark) { .tabs button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #04130c; } }

/* 시세 */
#syms { gap: 2px; }
#syms button { display: inline-flex; gap: 2px; align-items: baseline; padding: 0 4px; }
#syms em { font-style: normal; font-size: calc(11px * var(--fs)); }
.up { color: var(--up); } .down { color: var(--down); }
#syms button[aria-pressed="true"] .up, #syms button[aria-pressed="true"] .down { color: inherit; }
#price { font-size: calc(26px * var(--fs)); font-weight: 800; line-height: 1.15; letter-spacing: -.3px; }
#chart { width: 100%; flex: 1 1 60px; min-height: 60px; position: relative; margin: 4px 0; }
#chart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#tip { position: absolute; top: 0; padding: 1px 7px; border-radius: 8px; border: 1px solid var(--green); background: var(--card); font-size: calc(11.5px * var(--fs)); white-space: nowrap; pointer-events: none; display: none; }
#rows { width: 100%; border-collapse: collapse; font-size: calc(12px * var(--fs)); flex: none; }
#rows td { padding: 1px 0; border-top: 1px solid var(--hair); }
#rows td:nth-child(2), #rows td:nth-child(3) { text-align: right; font-variant-numeric: tabular-nums; }
.add { display: flex; gap: 6px; flex: none; }
.add input { flex: 1; min-width: 0; height: 27px; border: 1px solid var(--hair); border-radius: 999px; padding: 0 13px; background: var(--glass); }
.pill { height: 27px; padding: 0 13px; border-radius: 999px; background: var(--green); color: #fff; font-weight: 700; flex: none; }
.ghost { background: none; color: var(--muted); font-weight: 400; border: 1px solid var(--hair); padding: 0 10px; }
#symAdd { margin-top: 4px; }
#symAdd input, #symAdd .pill { height: 24px; padding: 0 9px; font-size: calc(11px * var(--fs)); }

/* 할일·메모 */
#todos { margin-top: 3px; }
.todo { display: flex; align-items: center; gap: 8px; padding: 2px; border-bottom: 1px solid var(--hair); }
.todo input { width: 16px; height: 16px; flex: none; accent-color: var(--green); margin: 0; }
.todo .txt { flex: 1; min-width: 0; width: auto; height: auto; border-radius: 0; opacity: 1; text-align: left; color: inherit; }
.todo .txt:hover { color: var(--green); }
.todo.done .txt { text-decoration: line-through; color: var(--muted); }
#events summary, #events summary *, #memoCard .todo .txt, #memoCard .todo .txt *, #memoCard .memoRow, #memoCard .memoRow * { font-weight: 700; }
.tag { margin-left: 5px; font-style: normal; font-size: .8em; color: var(--muted); }
.due { flex: none; font-style: normal; font-size: .85em; color: var(--muted); }
.due.late { color: var(--up); font-weight: 700; }
.todo button { color: var(--muted); width: 22px; height: 22px; border-radius: 50%; opacity: 0; }
.todo:hover button, .todo button:focus-visible { opacity: 1; }
.catTabs { margin: 3px 0 0; }
.pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.pane[hidden] { display: none; }
#newsTabs button { padding: 0 6px; }
#reader { width: min(1100px, 96vw); height: 94vh; }
#readerFrame { flex: 1; width: 100%; min-height: 0; border: 0; border-radius: 10px; background: #fff; }
.memoRow { display: flex; width: 100%; text-align: left; }
.memoRow:hover .t { color: var(--green); }
.memoRow .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.memoRow img { flex: none; width: 26px; height: 26px; object-fit: cover; border-radius: 6px; }
dialog.pop { border: 1px solid var(--glass-edge); border-radius: 16px; padding: 12px 14px; color: var(--text); background: var(--card); box-shadow: var(--glass-shade); }
dialog.pop::backdrop { background: rgba(0, 30, 43, .35); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
dialog.pop[open] { display: flex; flex-direction: column; gap: 6px; }
#editor, #sheet { width: min(920px, 92vw); height: min(760px, 88vh); }
#editor[data-kind="todo"] { height: auto; }
#editor[data-kind="todo"] .onlyMemo, #editor[data-kind="memo"] .onlyTodo { display: none; }
#cats { width: min(320px, 92vw); }
#edText, #catText { resize: none; border: 1px solid var(--hair); border-radius: 10px; padding: 8px 10px; background: none; }
#edText { flex: 1; min-height: 110px; font-size: 16px; line-height: 1.5; }
#catText { height: 160px; }
.edRow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; flex: none; }
.edRow label { display: flex; align-items: center; gap: 5px; color: var(--muted); }
.edRow select, .edRow input { width: auto; height: 28px; margin: 0; padding: 0 8px; border: 1px solid var(--hair); border-radius: 8px; background: var(--card); }
.edRow .pill { margin-left: auto; }
#edImages { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; max-height: 45%; overflow-y: auto; flex: none; }
.shot { position: relative; }
.shot img { display: block; width: 100%; max-height: 200px; object-fit: contain; border-radius: 8px; background: var(--tint); }
.shot button { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--navy); color: #fff; }
#sheetList { flex: 1; min-height: 0; overflow-y: auto; font-size: 15px; }
.memoBig { display: block; width: 100%; text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--hair); white-space: pre-wrap; }
.memoBig:hover { background: var(--tint); }
.memoBig img { display: inline-block; max-width: 220px; max-height: 160px; margin: 4px 4px 0 0; border-radius: 8px; vertical-align: top; }

/* 오른쪽 채팅 */
#chatGrip { display: none; position: absolute; inset: 0 auto 0 -3px; width: 7px; z-index: 6; cursor: col-resize; touch-action: none; }
#chatGrip:hover { background: var(--green-soft); }
@media (min-width: 761px) { #chatGrip { display: block; } }
#chat { --fs: calc(var(--font) * var(--chatFont, 1)); font-size: calc(14px * var(--fs)); touch-action: pan-x pan-y; width: var(--chat); flex: none; position: relative; background: var(--card); border-left: 1px solid var(--glass-edge); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); }
#scroll { position: absolute; inset: 0; overflow-y: auto; padding: 100px 16px var(--pad, 110px); scroll-padding-top: 100px; }
#thread { display: flex; flex-direction: column; gap: 10px; }
#chatTop {
  position: absolute; z-index: 3; top: 0; left: 0; right: 0; padding: 8px 12px 9px; text-align: center;
  background: color-mix(in srgb, var(--card) 88%, transparent); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
  border-bottom: 1px solid var(--green-soft);
}
#chatTop .bear { width: 50px; height: 36px; display: block; flex: none; border: 0; border-radius: 0; padding: 0; background: none; }
#chatTop .left { position: absolute; top: 12px; left: 8px; }
#chatTop .rt { position: absolute; top: 12px; right: 8px; }
#chatFont { position: absolute; top: 12px; right: 34px; display: flex; align-items: center; gap: 1px; color: var(--muted); font-size: 11px; }
#chatFont .icon { font-size: 11px; min-width: 20px; padding: 0 3px; }
#chatAddr { display: none; font-size: calc(11px * var(--fs)); color: var(--muted); }
#stateLine { display: flex; gap: 7px; align-items: center; max-width: max(190px, calc(100% - 170px)); margin-left: 40px; }
#dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.working #dot { background: var(--green); animation: pulse 1.2s ease-in-out infinite; }
#status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: calc(13px * var(--fs)); }
@keyframes pulse { 50% { opacity: .3; transform: scale(.8); } }
#drawer {
  position: absolute; z-index: 4; top: 0; bottom: 0; left: 0; width: 82%; padding: 12px 10px; display: none; flex-direction: column; gap: 8px;
  background: var(--card); border-right: 1.5px solid var(--green);
}
#drawer.on { display: flex; }
#list { flex: 1; overflow-y: auto; }
#list button { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 12px; }
#list button:hover { background: var(--tint); }
#list button[aria-current="true"] { box-shadow: inset 0 0 0 1.5px var(--green); }
#list .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#list .d { display: block; font-size: calc(12px * var(--fs)); color: var(--muted); }
#list .on .d::after { content: " · 답변 중"; color: var(--green); }

.row { display: flex; }
.row.me { justify-content: flex-end; }
.bubble { max-width: 92%; padding: 7px 12px; border-radius: 14px; min-width: 0; background: var(--glass); line-height: 1.45; }
.me .bubble { background: linear-gradient(135deg, color-mix(in srgb, var(--green) 30%, transparent), color-mix(in srgb, var(--green) 12%, transparent));
  border: 1px solid color-mix(in srgb, var(--green) 50%, transparent); border-bottom-right-radius: 5px; white-space: pre-wrap;
  box-shadow: 0 4px 16px color-mix(in srgb, var(--green) 20%, transparent), inset 0 1px 0 var(--glass-edge);
  -webkit-backdrop-filter: blur(12px) saturate(150%); backdrop-filter: blur(12px) saturate(150%); }
.bot .bubble { border: 1.5px solid var(--green-soft); border-bottom-left-radius: 5px; }
.err { color: var(--up); }
.bubble > :first-child { margin-top: 0; }
.bubble > :last-child { margin-bottom: 0; }
.bubble p, .bubble ul, .bubble ol, .bubble pre, .bubble blockquote, .bubble .tbl { margin: .6em 0; }
.bubble ul, .bubble ol { padding-left: 1.4em; }
.bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: .9em 0 .35em; line-height: 1.35; font-size: 1.06em; }
.bubble h1 { font-size: 1.2em; } .bubble h2 { font-size: 1.13em; }
.bubble hr { border: 0; border-top: 1px solid var(--hair); margin: 1em 0; }
.bubble blockquote { padding-left: .8em; border-left: 3px solid var(--green-soft); color: var(--muted); }
.bubble code { font: .9em Consolas, "D2Coding", "Malgun Gothic", monospace; background: var(--tint); padding: .1em .35em; border-radius: 6px; }
.bubble pre { background: var(--tint); padding: 10px 12px; border-radius: 12px; overflow-x: auto; word-break: normal; overflow-wrap: normal; }
.bubble pre code { background: none; padding: 0; }
.bubble a { color: inherit; }
.tbl { overflow-x: auto; }
.bubble table { border-collapse: collapse; font-size: .93em; word-break: normal; }
.bubble th, .bubble td { border: 1px solid var(--hair); padding: 4px 8px; text-align: left; vertical-align: top; }
.bubble th { background: var(--tint); }
.files { display: flex; flex-wrap: wrap; gap: 6px; }
.bubble .files { margin-bottom: 6px; }
.bubble .files:last-child { margin-bottom: 0; }
.bubble img { max-width: 100%; max-height: 200px; border-radius: 10px; display: block; }
.file { font-size: calc(12.5px * var(--fs)); padding: 2px 10px; border-radius: 999px; border: 1px solid var(--green-soft); background: var(--card); }
.empty { text-align: center; color: var(--muted); padding-top: 24vh; font-size: calc(16px * var(--fs)); }
.typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: pulse 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
form { position: absolute; z-index: 2; bottom: 12px; left: 12px; right: 12px; }
#tray { margin-bottom: 6px; }
#tray .file { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 12px; }
#tray .file img { height: 24px; width: 24px; object-fit: cover; border-radius: 6px; }
#tray .file button { width: 22px; height: 22px; border-radius: 50%; line-height: 1; }
.bar { display: flex; align-items: flex-end; gap: 4px; padding: 6px; border-radius: 28px; background: color-mix(in srgb, var(--card) 88%, transparent); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border: 1.5px solid var(--green); }
textarea { outline: 0; }
#input { flex: 1; min-width: 0; resize: none; border: 0; background: none; padding: 7px 6px; line-height: 1.5; height: 36px; max-height: 170px; }
#input::placeholder { color: var(--muted); }
#attach { width: 36px; height: 36px; flex: none; border-radius: 999px; font-size: calc(19px * var(--fs)); line-height: 1; color: var(--muted); }
#attach:hover { background: var(--tint); }
#send { height: 36px; flex: none; padding: 0 17px; border-radius: 999px; background: var(--green); color: #fff; font-weight: 700; }
#jobBtn { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-weight: 700; font-size: calc(12px * var(--fs)); color: #fff; background: #16a34a; flex: none; }
#jobBtn.on { background: #dc2626; }
.jobRow { border: 1px solid var(--hair); border-radius: 10px; padding: 6px 8px; margin-top: 5px; }
.jobRow .jobHead { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.jobRow .jobText { flex: 1 1 100%; overflow-wrap: anywhere; }
.jobRow.running { border-color: #dc2626; }
.jobRow ol.jobSteps { list-style: none; padding-left: 0; }
.jobSteps li { padding: 1px 0; overflow-wrap: anywhere; }
.jobSteps li.now { font-weight: 700; }
.jobPast { margin-top: 8px; font-weight: 700; }
.jobRow ol { margin: 4px 0 0; padding-left: 18px; max-height: 30dvh; overflow: auto; }
#send:disabled { opacity: .45; cursor: default; }
#drop {
  position: fixed; inset: 0; z-index: 9; display: none; place-items: center; font-size: calc(22px * var(--fs)); font-weight: 700;
  background: rgba(0, 180, 90, .14); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
#drop.on { display: grid; }
/* 창이 좁으면 왼쪽 판을 스크롤로 푼다 */
@media (max-width: 1240px) {
  #cols { overflow-y: auto; grid-template-columns: minmax(0, 1fr); grid-auto-rows: max-content; }
  .col, .card { flex: none !important; }
  .grow, #newsCard { height: 330px; }
  #marketCard { height: 560px; }
}
/* 휴대폰: 채팅이 기본, 카드 판은 버튼으로 바꿔 본다 */
.phone { display: none; }
/* 위젯 */
.wbody { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; overflow: hidden auto; outline: 0; }
.wbody > * { flex-shrink: 0; }
.wbody .add, .wpop .add, #props .add { position: static; flex: none; }
.wico { font-size: 20px; width: 28px; text-align: center; }
.wpop { width: min(720px, 94vw); max-height: 90dvh; overflow: auto; }
.wpopBody { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.wpopBody h3 { margin: 6px 0 2px; }
.wplaces { display: flex; gap: 4px; flex-wrap: wrap; flex: none; }
.wplaces .pill { height: auto; min-height: 24px; padding: 1px 9px; font-weight: 500; }
.werr { color: var(--up); font-size: calc(12px * var(--fs, 1)); }
.wform { position: static; display: flex; flex-direction: column; gap: 5px; padding: 2px; }
.wxline { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2px; width: 100%; text-align: left; min-width: 0; white-space: nowrap; overflow: hidden; }
.wxtop { display: flex; align-items: center; gap: 10px; min-width: 0; }
.wxtop .wxico { font-size: calc(36px * var(--fs)); line-height: 1; }
.wxtop b { font-size: calc(30px * var(--fs)); line-height: 1.1; }
.wxword { font-size: calc(24px * var(--fs)); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.wxline .sub { width: 100%; font-size: calc(20px * var(--fs)); }
.wxico { font-size: calc(18px * var(--fs)); }
#w-weather { flex: none !important; padding-top: 4px; padding-bottom: 4px; }
#w-weather .head { position: absolute; right: 8px; top: 3px; margin: 0; z-index: 1; }
#w-weather .head h2 { display: none; }
#w-weather .wbody { flex: none; height: calc(84px * var(--fs) + 46px); }  /* 세 보기 모두 일자별이 다 들어가는 높이로 고정 */
/* 세로 제목 카드(.vtitle): 제목을 왼쪽에 세워 내용 칸을 넓힌다. 위젯은 vtitle: true 로 켠다 */
.vtitle { display: grid; grid-template: auto minmax(0, 1fr) / auto minmax(0, 1fr); column-gap: 3px; padding-left: 3px; }
.vtitle .head { display: contents; }
.vtitle h2 { grid-area: 1 / 1 / 3 / 2; align-self: center; writing-mode: vertical-rl; text-orientation: upright; line-height: 1; letter-spacing: .05em; }
.vtitle .tools { position: absolute; top: 6px; right: 10px; }
#eventCard .grip, #driveCard .grip { top: 9px; right: 62px; }
.vtitle .tabs { grid-area: 1 / 2; padding-right: 54px; }
#eventCard .tabs { flex-wrap: nowrap; gap: 2px; }
#eventCard .tabs button { padding: 0 3px; }
.vtitle .list { grid-area: 2 / 2; }
.vtitle .grip { position: absolute; top: 4px; right: 8px; z-index: 1; background: var(--card); border-radius: 5px; }
.vtitle .wbody { grid-area: 1 / 2 / 3 / 3; }
@media (min-width: 761px) {  /* 휴대폰은 손가락으로 누를 크기를 유지한다 */
  #w-links .add { gap: 3px; }
  #w-links .add input, #w-links .add .pill { height: 14px; padding: 0 6px; font-size: max(8px, calc(7px * var(--fs))); line-height: 1; }
}
.wxhours { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px; }
.wxhours > div { flex: none; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.wxhead { display: flex; align-items: center; gap: 8px; padding-right: 44px; min-height: 22px; }
.wxname { font-weight: 700; white-space: nowrap; }
.wxhead .sub { min-width: 0; }
.wxstrip { flex: 1; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 3px; }
.wxstrip > div { flex: 1 0 auto; min-width: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3px 6px; border: 1px solid var(--hair); border-radius: 10px; background: var(--card); font-variant-numeric: tabular-nums; }
.wxstrip .wxico { line-height: 1.2; }
.calcOut { min-height: 1.5em; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.calcKeys { flex: 1; min-height: 120px; display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 1fr; gap: 3px; }
.calcKeys button { border-radius: 8px; background: var(--tint); }
.calcKeys button:hover { color: var(--green); }
.calcKeys .eq { background: var(--green); color: #fff; }
.wchips { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
#w-links .wchips { flex: 1; overflow: auto; }
.wlink { display: inline-flex; align-items: center; border: 1px solid var(--hair); border-radius: 999px; padding-left: 4px; max-width: 100%; }
.wlink a { display: inline-flex; align-items: center; gap: 4px; font-size: calc(15px * var(--fs)); font-weight: 700; color: inherit; text-decoration: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.wlink[style] { border-color: var(--lc); background: color-mix(in srgb, var(--lc) 18%, transparent); }
.lcBtn { flex: none; width: 12px; height: 12px; margin-left: 5px; padding: 0; border-radius: 50%; border: 1px solid var(--muted); background: var(--lc, conic-gradient(#ef4444, #eab308, #22c55e, #3b82f6, #a855f7, #ef4444)); }
.lcPal { margin: 0; padding: 7px; grid-template-columns: repeat(6, 22px); gap: 5px; color: var(--muted); background: var(--card); border: 1.5px solid var(--green); border-radius: 12px; }
.lcPal:popover-open { display: grid; }
.lcPal button { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 1px solid var(--hair); }
.lico { position: relative; width: 16px; height: 16px; flex: none; border-radius: 4px; background: var(--tint); display: inline-grid; place-items: center; font-size: 10px; overflow: hidden; }
.lico img { position: absolute; inset: 0; width: 100%; height: 100%; }
.unitRow { display: flex; gap: 6px; align-items: center; flex: none; }
.unitRow select { width: 42%; margin: 0; }
.unitRow label .field { width: 100%; }
.wtime { font-variant-numeric: tabular-nums; }
.secText { flex: 1; min-height: 80px; width: 100%; resize: none; border: 1px solid var(--hair); border-radius: 10px; background: var(--glass); padding: 6px 8px; }
.clipList { flex: 1 1 50px; min-height: 50px; overflow: auto; }
.line.clip { gap: 2px; padding: 1px 0; align-items: center; }
.clipText { flex: 1; min-width: 0; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.clipText.copied { color: var(--green); font-weight: 700; }
.line.stock { align-items: center; gap: 6px; padding: 2px; }
.stockRows { flex: 1 1 60px; min-height: 60px; overflow: auto; }
.stockName { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.stockPct { width: 5em; text-align: right; font-variant-numeric: tabular-nums; }
.wspark { width: 44px; height: 16px; display: block; }
.imgEmpty { flex: 1; min-height: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 1px dashed var(--hair); border-radius: 10px; cursor: pointer; text-align: center; padding: 6px; }
.imgStage { position: relative; flex: 1; min-height: 60px; border-radius: 10px; overflow: hidden; background: var(--tint); }
.imgScroll { position: absolute; inset: 0; overflow: auto; cursor: grab; touch-action: pan-y; }
.imgScroll img { display: block; width: 100%; height: auto; }
.imgBig { flex: none; height: 70dvh; }
.imgNav { position: absolute; top: 50%; translate: 0 -50%; width: 26px; height: 26px; border-radius: 50%; background: rgba(0, 0, 0, .4); color: #fff; }
.imgBar { position: absolute; right: 4px; top: 4px; display: flex; gap: 3px; opacity: 0; }
.imgStage:hover .imgBar, .imgBar:focus-within { opacity: 1; }
.imgBar button:not(.pill) { width: 26px; height: 26px; border-radius: 50%; background: rgba(0, 0, 0, .4); color: #fff; }
.imgCap { text-align: center; flex: none; }
.imgDots { display: flex; justify-content: center; gap: 4px; flex: none; }
.imgDots button { width: 7px; height: 7px; padding: 0; border-radius: 50%; background: var(--hair); }
.imgDots button[aria-current="true"] { background: var(--green); }
.imgNote:empty { display: none; }
.imgDrop { border: 1px dashed var(--hair); border-radius: 10px; padding: 8px; text-align: center; }
.imgRows { max-height: 44dvh; overflow: auto; }
.imgRow { align-items: center; gap: 4px; }
.imgRow img { width: 44px; height: 34px; object-fit: cover; border-radius: 6px; flex: none; }
.imgRow .field { margin: 0; flex: 1; min-width: 0; }
.imgRow button:disabled { opacity: .3; }
.ochips button { padding: 0 6px; }
.obody { flex: 1; min-height: 170px; display: flex; gap: 8px; container-type: inline-size; }
.oleft { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
.ohead { display: flex; justify-content: space-between; gap: 8px; }
.onow b { font-size: calc(22px * var(--fs)); }
.olist { flex: 1; min-height: 0; overflow: auto; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.olist li { display: flex; gap: 5px; align-items: center; border: 1px solid var(--hair); border-radius: 7px; padding: 1px 5px; }
.olist .on { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.olist .need, .ochip.need { border-color: var(--green); }
.ofig { position: relative; isolation: isolate; aspect-ratio: 686 / 1024; flex: 0 1 44%; max-height: 100%; align-self: center; border: 1px solid var(--hair); border-radius: 14px; overflow: hidden; background: rgba(255, 255, 255, .6); }
.ofig svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ofig img { position: relative; display: block; width: 100%; height: 100%; object-fit: contain; mix-blend-mode: darken; }
.ogrid { display: grid; grid-template-columns: 1fr minmax(0, 240px); gap: 12px; }
.ogrid .ofig { width: 100%; max-height: none; }
.ochip { border: 1px solid var(--hair); border-radius: 7px; padding: 2px 6px; }
.odanger { border: 1px solid var(--hair); border-radius: 10px; padding: 6px 8px; margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }

.otips { margin: 0; padding-left: 16px; }
@media (max-width: 760px) { .ogrid { grid-template-columns: 1fr; } .ogrid .ofig { width: 60%; margin: 0 auto; } }
.addr { color: #8fa8a0; font-size: calc(12px * var(--fs)); }
#attachMenu { display: none; position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 5; padding: 6px; border-radius: 16px; background: var(--card); border: 1.5px solid var(--green); }
#attachMenu.on { display: block; }
#attachMenu button { display: block; width: 100%; text-align: left; padding: 9px 14px; border-radius: 10px; white-space: nowrap; }
#lock { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: var(--tint); padding: 24px; }
#lock.on { display: grid; }
#lockBox { width: min(300px, 100%); text-align: center; background: var(--card); border: 1.5px solid var(--green); border-radius: 20px; padding: 24px 20px; }
#lockBox svg { width: 72px; height: 72px; }

#lockMsg { min-height: 20px; font-size: calc(13px * var(--fs)); color: var(--up); }
@media (hover: none) { .ask, .todo button, .grip { opacity: 1; } .grip button { height: 24px; line-height: 24px; padding: 0 8px; } #syms { padding-right: 62px; } }
@media (max-width: 760px) {
  .phone { display: inline-grid; }
  body { position: fixed; top: 0; left: 0; width: 100%; height: var(--vh, 100dvh); }

  #chat { width: 100%; border-left: 0; }

  body.board #chat { display: none; }

<script>
const $ = id => document.getElementById(id);
const scroll = $('scroll'), thread = $('thread'), input = $('input');
let shown = null, ready = false, current = null, stream = null, busy = false, uploading = 0, pending = [], drag = 0;
let state = null, topic = '주요', symbol = null, range = '3mo', todos = [], memos = [], cats = {todo: [], memo: []}, symbols = [];

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isImage = name => /\.(png|jpe?g|gif|webp|bmp)$/i.test(name);

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  if (res.status === 401) showLock();
  const data = await res.json();
  if (!res.ok) throw new Error(data.error);
  return data;
}
const phone = () => matchMedia('(max-width: 760px)').matches;

// ── 비밀번호: 맞히면 서버가 쿠키를 주고, 이후 이 기기에서는 묻지 않는다 ──
let unlocked = null;
function showLock() {
  $('lock').classList.add('on');
  $('pin').focus();
  return new Promise(ok => { unlocked = ok; });
}
$('lockBox').addEventListener('submit', async e => {
  e.preventDefault();
  const res = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({pin: $('pin').value})});
  $('pin').value = '';
  if (res.ok) { $('lock').classList.remove('on'); $('lockMsg').textContent = ''; unlocked?.(); if (ready) location.reload(); }
  else $('lockMsg').textContent = (await res.json()).error;
});
$('pin').addEventListener('input', () => { if ($('pin').value.length === 4) $('lockBox').requestSubmit(); });

// ── 맨 위 시계 ──
function tick() {
  const d = new Date(), h = d.getHours();
  const part = h < 6 ? '새벽' : h < 12 ? '오전' : h < 18 ? '오후' : '저녁';
  const date = d.toLocaleDateString('ko-KR', {month: 'long', day: 'numeric', weekday: 'short'});
  const time = d.toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit', hour12: false});
  $('clock').textContent = `${date} · ${time} ${part}입니다, 교수님`;
}

// ── 비서 카드 ──
const pct = v => v == null ? '–' : Math.round(v * 100) + '%';
const resetText = (sec, day) => {
  if (!sec) return '';
  const d = new Date(sec * 1000);
  return '~' + (day ? `${d.getMonth() + 1}/${d.getDate()}` : d.toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit', hour12: false}));
};
function drawAgent() {
  const s = state.settings, u = state.usage || {};
  if (!$('model').options.length) {
    $('model').innerHTML = Object.entries(state.models).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('');
    $('effort').innerHTML = Object.entries(state.efforts).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('');
  }
  $('model').value = s.model; $('effort').value = s.effort; $('enabled').checked = s.enabled;
  $('sessionPct').textContent = pct(u.session); $('weekPct').textContent = pct(u.week);
  $('sessionBar').style.width = pct(u.session === undefined ? 0 : u.session); $('weekBar').style.width = pct(u.week === undefined ? 0 : u.week);
  $('sessionReset').textContent = resetText(u.sessionReset); $('weekReset').textContent = resetText(u.weekReset, true);
  input.placeholder = s.enabled ? '교수님, 말씀하세요' : '비서가 꺼져 있습니다';
  input.disabled = !s.enabled;
}
async function saveSettings() {
  await api('/api/dash', {settings: {model: $('model').value, effort: $('effort').value, enabled: $('enabled').checked}});

const num = v => v == null ? '–' : v.toLocaleString('ko-KR', {maximumFractionDigits: Math.abs(v) < 1000 ? 2 : Math.abs(v) < 100000 ? 2 : 0});
const sign = v => v > 0 ? 'up' : v < 0 ? 'down' : '';
const arrow = v => v > 0 ? '▲' : v < 0 ? '▼' : '';
const RANGES = [['1d', '1일'], ['5d', '5일'], ['1mo', '1개월'], ['3mo', '3개월'], ['5y', '5년'], ['max', '최대']];

async function loadMarket() {
  $('ranges').innerHTML = RANGES.map(([k, v]) => `<button type="button" data-range="${k}" aria-pressed="${k === range}">${v}</button>`).join('');
  if (!symbol) return;
  const s = symbols.find(x => x.symbol === symbol);

    if (m.symbol !== symbol) return;
    $('symName').textContent = `${s.name} · ${m.symbol}${m.currency ? ' · ' + m.currency : ''}`;
    $('price').textContent = num(m.price);
    const diff = m.price - m.prev;
    $('change').className = 'small ' + sign(diff);
    $('change').textContent = `${arrow(diff)} ${num(Math.abs(diff))} · ${(diff / m.prev * 100).toFixed(2)}% (전일 대비)`;
    drawChart(m.points);
    $('rows').innerHTML = m.rows.map(r => `<tr><td>${r.label}</td><td class="muted">${num(r.low)} ~ ${num(r.high)}</td><td class="${sign(r.change)}">${arrow(r.change)}${num(Math.abs(r.change))}</td></tr>`).join('');
  } catch (err) { $('symName').textContent = err.message; }
}
function drawChart(points) {
  const box = $('chart'), W = box.clientWidth || 300, H = box.clientHeight || 80;
  box.querySelector('svg')?.remove();
  if (points.length < 2) return;
  const ys = points.map(p => p[1]), lo = Math.min(...ys), hi = Math.max(...ys), pad = 4;
  const x = i => i / (points.length - 1) * W, y = v => H - pad - (v - lo) / ((hi - lo) || 1) * (H - pad * 2);
  const line = points.map((p, i) => `${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
  box.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="시세 그래프"><polygon points="0,${H} ${line} ${W},${H}" fill="var(--green)" opacity=".1"/><polyline points="${line}" fill="none" stroke="var(--green)" stroke-width="1.6"/><line id="cursor" y1="0" y2="${H}" stroke="var(--muted)" stroke-dasharray="3" visibility="hidden"/></svg>`);
  box.onmousemove = e => {
    const r = box.getBoundingClientRect(), i = Math.max(0, Math.min(points.length - 1, Math.round((e.clientX - r.left) / r.width * (points.length - 1))));
    const c = $('cursor'), tip = $('tip'), day = new Date(points[i][0] * 1000);
    c.setAttribute('x1', x(i)); c.setAttribute('x2', x(i)); c.setAttribute('visibility', 'visible');
    tip.textContent = `${day.toLocaleDateString('ko-KR', {year: '2-digit', month: 'numeric', day: 'numeric'})} ${num(points[i][1])}`;
    tip.style.display = 'block';
    tip.style.left = Math.max(0, Math.min(r.width - tip.offsetWidth, e.clientX - r.left - tip.offsetWidth / 2)) + 'px';
  };
  box.onmouseleave = () => { $('tip').style.display = 'none'; $('cursor')?.setAttribute('visibility', 'hidden'); };
}

// ── 마크다운: 먼저 전부 이스케이프하므로 답변 글이 HTML 로 실행되지 않는다 ──
function inline(s) {
  const codes = [];
  s = esc(s).replace(/`([^`\n]+)`/g, (_, c) => (codes.push(c), `\u0000${codes.length - 1}\u0000`));
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
       .replace(/~~(.+?)~~/g, '<del>$1</del>')
       .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
function markdown(src) {
  const lines = src.replace(/\r/g, '').split('\n'), out = [];
  for (let i = 0; i < lines.length;) {
    const l = lines[i];
    let m;
    if (/^\s*```/.test(l)) {
      const code = [];
      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) code.push(lines[i]);
      i++;
      out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
    } else if (!l.trim()) {
      i++;
    } else if ((m = l.match(/^(#{1,6})\s+(.*)/))) {
      const n = Math.min(m[1].length, 4);
      out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++;
    } else if (/^\s*([-*_])\1{2,}\s*$/.test(l)) {
      out.push('<hr>'); i++;
    } else if (l.includes('|') && /^\s*\|?[\s:|-]*-[\s:|-]*$/.test(lines[i + 1] || '')) {
      const head = cells(l).map(c => `<th>${inline(c)}</th>`).join('');
      const rows = [];
      for (i += 2; i < lines.length && lines[i].includes('|'); i++)
        rows.push('<tr>' + cells(lines[i]).map(c => `<td>${inline(c)}</td>`).join('') + '</tr>');
      out.push(`<div class="tbl"><table><thead><tr>${head}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`);
    } else if (/^\s*>/.test(l)) {
      const q = [];
      for (; i < lines.length && /^\s*>/.test(lines[i]); i++) q.push(lines[i].replace(/^\s*>\s?/, ''));
      out.push(`<blockquote>${markdown(q.join('\n'))}</blockquote>`);
    } else if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const tag = /^\s*\d/.test(l) ? 'ol' : 'ul', items = [];
      for (; i < lines.length; i++) {
        const it = lines[i].match(/^\s*(?:[-*+]|\d+[.)])\s+(.*)/);
        if (it) items.push(inline(it[1]));
        else if (/^\s{2,}\S/.test(lines[i]) && items.length) items[items.length - 1] += '<br>' + inline(lines[i].trim());
        else break;
      }
      out.push(`<${tag}>${items.map(x => `<li>${x}</li>`).join('')}</${tag}>`);
    } else {
      const p = [];
      for (; i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*```|\s*>|\s*[-*+]\s|\s*\d+[.)]\s)/.test(lines[i]); i++) p.push(lines[i]);
      if (!p.length) p.push(lines[i++]);
      out.push(`<p>${p.map(inline).join('<br>')}</p>`);
    }
  }
  return out.join('');
}

function fileHtml(files) {
  if (!files?.length) return '';
  return '<div class="files">' + files.map(f => isImage(f.stored)
    ? `<img src="/uploads/${encodeURIComponent(f.stored)}" alt="${esc(f.name)}">`
    : `<span class="file">📎 ${esc(f.name)}</span>`).join('') + '</div>';
}
function drawUser(text, files) { bubble('me', fileHtml(files) + esc(text)); }
function drawBot(text) { bubble('bot', markdown(text)); }
function empty() { thread.innerHTML = '<div class="empty">무엇을 도와드릴까요, 교수님?</div>'; }

async function drawList() {
  const items = await api('/api/conversations');
  shown = items.find(c => c.id === current)?.updated ?? null;
  const list = $('list');
  list.innerHTML = items.length ? '' : '<div class="none">아직 대화가 없습니다</div>';
  for (const c of items) {
    const b = document.createElement('button');
    b.type = 'button';
    if (c.busy) b.className = 'on';
    if (c.id === current) b.setAttribute('aria-current', 'true');
    const when = new Date(c.updated * 1000).toLocaleString('ko-KR', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'});
    b.innerHTML = `<span class="t">${esc(c.title)}</span><span class="d">${when}</span>`;
    b.onclick = () => { $('drawer').classList.remove('on'); openConv(c.id); };
    list.append(b);
  }
  return items;
}
let opening = 0;  // 대화 열기가 겹치면 마지막 것만 그린다. 안 그러면 말풍선이 두 번 찍힌다
async function openConv(id) {
  const turn = ++opening;
  stream?.close();
  current = id;
  thread.innerHTML = '';
  setBusy(false);
  setStatus('대기 중');
  if (!id) { empty(); drawList(); input.focus(); return; }
  const conv = await api('/api/conversation?id=' + id);
  if (turn !== opening) return;
  conv.messages.forEach(m => m.role === 'user' ? drawUser(m.text, m.files) : drawBot(m.text));
  drawList();
  toBottom();
  if (conv.busy) follow(id);
}

// 다른 기기(휴대폰·컴퓨터)에서 보낸 말을 받아 온다. 이 화면이 일하는 중이면 건드리지 않는다
async function sync() {
  drawJobs();
  if (document.hidden || busy) return;
  let items;
  try { items = await api('/api/conversations'); } catch { return; }
  if (busy) return;
  const top = items[0], mine = items.find(c => c.id === current);
  const idle = !input.value.trim() && !pending.length;
  if (top?.busy && !top.fork && top.id !== current && idle) openConv(top.id);
  else if (mine && (mine.busy || mine.updated !== shown)) openConv(current);
  else if (!current && top && top.updated > bootTime && idle) openConv(top.id);
  else if (items.length !== $('list').children.length) drawList();
}

// 연결이 끊기면 스트림을 닫는다. 서버가 다시 켜지면 Run 이 새것이라 이어받기 위치가 맞지 않으므로, sync 가 대화를 다시 열어 처음부터 받는다
function follow(id) {
  setBusy(true);
  const b = bubble('bot', '<span class="typing"><i></i><i></i><i></i></span>');
  let text = '', queued = false;
  const paint = () => {
    queued = false;
    const stick = nearBottom();
    b.innerHTML = markdown(text);
    if (stick) toBottom();
  };
  const es = stream = new EventSource('/api/stream?id=' + id);
  es.addEventListener('status', e => setStatus(JSON.parse(e.data), true));
  es.addEventListener('delta', e => {
    text += JSON.parse(e.data);
    if (!queued) { queued = true; requestAnimationFrame(paint); }
  });
  es.addEventListener('error', e => {
    if (e.data) { text += '\n\n⚠️ ' + JSON.parse(e.data); paint(); b.classList.add('err'); }
    else { es.close(); setBusy(false); setStatus('연결이 끊겨 다시 잇는 중입니다'); }
  });
  es.addEventListener('done', async () => {
    es.close();
    paint();
    setBusy(false);
    setStatus('대기 중');
    loadDash();  // 사용량 갱신
    drawJobs();
    const now = await api('/api/conversation?id=' + id);
    if (now.busy && current === id) openConv(id);  // 기다리던 다음 요청이 이어서 시작됐다
    else drawList();
  });
}

// ── 진행 내용 ──
let jobs = [], fails = 0, noteTimer = 0, backShown = false;
function netNote(text, bad, ms) {
  const box = $('netNote');
  clearTimeout(noteTimer);
  box.textContent = text;
  box.classList.toggle('bad', !!bad);
  box.hidden = false;
  if (ms) noteTimer = setTimeout(() => { box.hidden = true; }, ms);
}
// 작업을 단계로 보여 준다. 끝난 단계는 ✓, 지금 단계는 ▶
// 진행 중이면 최근 3단계, 끝난 작업이면 마지막 단계만 보이고 나머지는 펼쳐서 본다
function jobSteps(j, opened) {
  if (!j.steps?.length) return '';
  const running = j.state === 'running', keep = running ? 3 : 1, old = j.steps.slice(0, -keep), recent = j.steps.slice(-keep), key = j.conv + j.job + 'old';
  const row = (s, now) => `<li class="${now ? 'now' : ''}">${now ? '▶' : '✓'} ${esc(s.title)}${s.count ? ` <span class="muted">(도구 ${s.count}회)</span>` : ''}</li>`;
  const more = old.length ? `<details data-key="${esc(key)}"${opened.has(key) ? ' open' : ''}><summary class="small muted">이전 단계 ${old.length}개 보기</summary><ol class="jobSteps small">${old.map(s => row(s)).join('')}</ol></details>` : '';
  return `${more}<ol class="jobSteps small">${recent.map((s, i) => row(s, running && i === recent.length - 1)).join('')}</ol>`;
}
async function drawJobs() {
  try { jobs = await api('/api/jobs'); } catch {
    if (++fails === 2) netNote('서버 연결이 끊겼습니다. 다시 연결되면 작업을 이어갑니다', true);  // 한 번은 휴대폰 깨어날 때도 난다
    return;
  }
  const back = jobs.filter(j => j.recovered).length, again = fails >= 2 ? '다시 연결되었습니다. ' : '';
  fails = 0;
  if (back) netNote(`${again}끊겼던 작업 ${back}건을 이어가는 중입니다`);
  else if (backShown) netNote('끊겼던 작업을 마쳤습니다', false, 8000);
  else if (again) netNote(again.trim(), false, 8000);
  backShown = back > 0;
  const live = jobs.filter(j => j.state === 'running').length, wait = jobs.filter(j => j.state === 'waiting').length;
  $('jobBtn').classList.toggle('on', live > 0 || wait > 0);
  $('jobBtn').textContent = live ? `진행중 ${live}${wait ? ` · 대기 ${wait}` : ''}` : wait ? `대기 ${wait}` : '대기';
  if (!$('jobPop').open) return;
  const openLogs = new Set([...document.querySelectorAll('#jobList details[open]')].map(d => d.dataset.key));
  const waitIn = id => jobs.filter(j => j.conv === id && j.state === 'waiting').length;
  const rows = jobs.map((j, i) => {
    const key = j.conv + j.job, btn = (a, t, label = t) => `<button class="pill ghost" type="button" data-i="${i}" data-a="${a}" aria-label="${label}">${t}</button>`;
    const done = j.state === 'done', tools = done ? '' : j.state === 'running'
      ? btn('stop', j.stopping ? '중지 중' : '중지')
      : (j.order ? btn('first', '먼저') + btn('up', '▲', '위로') : '') + (j.order < waitIn(j.conv) - 1 ? btn('down', '▼', '아래로') : '') + btn('parallel', '동시에') + btn('drop', '취소');
    const log = j.log?.length ? `<details data-key="${key}"${openLogs.has(key) ? ' open' : ''}><summary class="small">${esc(j.log.at(-1)[1])}</summary><ol class="small">${j.log.map(l => `<li>${new Date(l[0] * 1000).toLocaleTimeString('ko', {hour12: false})} ${esc(l[1])}</li>`).join('')}</ol></details>` : '';
    return `<div class="jobRow ${j.state}"><div class="jobHead"><b class="small">${done ? `${j.result} ${new Date(j.ended * 1000).toLocaleString('ko', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false})}` : j.state === 'running' ? '진행중' : `대기 ${j.order + 1}`}</b><button class="small muted" type="button" data-i="${i}" data-a="open" title="대화 열기">${esc(j.title)}</button><span style="flex:1"></span>${tools}${j.state !== 'waiting' && j.steps?.length ? '' : `<span class="jobText small">${esc(j.text.slice(0, 200))}</span>`}</div>${jobSteps(j, openLogs)}${log}</div>`;
  });
  // 최근 = 진행 중·대기 + 12시간 안에 끝난 작업. 그보다 오래된 작업은 접어 둔다
  const cut = Date.now() / 1000 - 12 * 3600, lately = rows.filter((_, i) => jobs[i].state === 'done' && jobs[i].ended >= cut), more = rows.filter((_, i) => jobs[i].state === 'done' && jobs[i].ended < cut);
  $('jobList').innerHTML = (rows.filter((_, i) => jobs[i].state !== 'done').join('') || '<div class="none">진행 중인 작업이 없습니다</div>')
    + (lately.length ? `<div class="jobPast small muted">최근 완료 (12시간 이내)</div>${lately.join('')}` : '')
    + (more.length ? `<details data-key="pastMore"${openLogs.has('pastMore') ? ' open' : ''}><summary class="small muted">이전 작업 ${more.length}개 더 보기</summary>${more.join('')}</details>` : '');
}
$('jobBtn').onclick = () => { $('jobPop').showModal(); drawJobs(); };

  const a = e.target.dataset.a, j = jobs[e.target.dataset.i];

  await api('/api/job', {conv: j.conv, job: j.job, action: a});

function resize() {
  input.style.height = '36px';
  input.style.height = Math.min(input.scrollHeight, 170) + 'px';
}
async function send(e) {
  e?.preventDefault();
  const text = input.value.trim();
  if (uploading || (!text && !pending.length)) return;
  const files = pending.map(p => ({name: p.name, stored: p.stored}));
  const wasBusy = busy;
  setBusy(true);
  if (!wasBusy) opening++;
  try {
    const res = await api('/api/send', {id: current, text, files});
    current = res.id;
    input.value = ''; pending = []; drawTray(); resize();
    drawJobs();
    if (res.queued) {  // 앞 작업이 끝나면 차례가 온다. 무관한 일이면 서버가 새 대화로 떼어 낸다
      setBusy(wasBusy);
      if (!wasBusy) sync();
      return;
    }
    drawUser(text, files);
    toBottom();
    follow(current);
    drawList();
  } catch (err) {
    setBusy(wasBusy);
    setStatus('보내기 실패: ' + err.message, wasBusy);
  }
}

// 파일은 놓는 즉시 서버에 올려 두고, 보낼 때 경로를 함께 전달한다
function drawTray() {
  const tray = $('tray');
  tray.innerHTML = '';
  pending.forEach((p, i) => {
    const chip = document.createElement('span');
    chip.className = 'file';
    chip.innerHTML = (p.preview ? `<img src="${p.preview}" alt="">` : '📎 ') + esc(p.name) + `<button type="button" aria-label="${esc(p.name)} 빼기">×</button>`;
    chip.querySelector('button').onclick = () => { pending.splice(i, 1); drawTray(); };
    tray.append(chip);
  });
}
async function addFiles(list) {
  for (const file of list) {
    uploading++; refreshSend();
    const prev = $('status').textContent;
    setStatus('파일 올리는 중: ' + file.name, true);
    try {
      const res = await fetch('/api/upload?name=' + encodeURIComponent(file.name), {method: 'POST', body: file});
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      pending.push({...data, preview: file.type.startsWith('image/') ? URL.createObjectURL(file) : ''});
      drawTray();
      setStatus(prev, busy);
    } catch (err) {
      setStatus('파일 올리기 실패: ' + err.message);
    }
    uploading--; refreshSend();
  }
}

const fingers = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
let pinch = null;
chatBox.addEventListener('touchstart', e => { if (e.touches.length === 2) pinch = {gap: fingers(e.touches), zoom: chatZoom}; }, {passive: true});
chatBox.addEventListener('touchmove', e => {
  if (!pinch || e.touches.length !== 2) return;
  if (e.cancelable) e.preventDefault();  // 두 손가락 움직임이 스크롤로 넘어가지 않게
  zoomChat(pinch.zoom * fingers(e.touches) / pinch.gap);
}, {passive: false});
['touchend', 'touchcancel'].forEach(n => chatBox.addEventListener(n, () => { pinch = null; }));
chatBox.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  zoomChat(chatZoom * Math.exp(-e.deltaY / 500));
}, {passive: false});
addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || !chatBox.matches(':hover, :focus-within')) return;
  const z = {'=': chatZoom * 1.1, '+': chatZoom * 1.1, '-': chatZoom / 1.1, 0: 1}[e.key];
  if (z) { e.preventDefault(); zoomChat(z); }
});
let chartTimer;
addEventListener('resize', () => { clearTimeout(chartTimer); chartTimer = setTimeout(loadMarket, 200); });

const bootTime = Date.now() / 1000;
(async () => {
  tick();
  setInterval(tick, 30000);
  const who = await (await fetch('/api/auth')).json();
  document.querySelectorAll('.addr').forEach(a => { a.textContent = '📱 ' + who.addr.replace('http://', ''); });
  if (!who.ok) await showLock();
  ready = true;
  await loadDash();
  todos = state.todos; memos = state.memos; cats = state.cats;
  drawKind('todo'); drawKind('memo');
  loadNews();
  loadDrive();
  loadOutputs();
  await loadQuotes();
  loadMarket();
  const items = await drawList();
  openConv(items[0]?.id ?? null);
  setInterval(loadDash, 60000);
  setInterval(sync, 2500);
  setInterval(loadOutputs, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { sync(); loadDash(); } });
  setInterval(loadNews, 600000);
  setInterval(async () => { await loadQuotes(); loadMarket(); }, 300000);
})();
</script>
